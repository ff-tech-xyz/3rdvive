modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mixins]]
config = "thirdvive.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
displayURL = "https://github.com/ff-tech-xyz/3rdvive"
displayTest = "IGNORE_ALL_VERSION"
description = """${description}"""

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "vivecraft"
type = "required"
versionRange = "[26.2-1.3.15,26.2-1.4.0)"
ordering = "AFTER"
side = "CLIENT"
